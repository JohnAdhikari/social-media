# Render blueprint — Zone Media backend (FastAPI + Postgres + WebSockets)
#
# DATABASE_URL must be set in the Render dashboard (Settings → Environment):
#   Go to Supabase/Neon (free tier), create a project, copy the connection
#   string (use the "transaction" or "direct" URL — the format is
#   postgresql://user:pass@host:5432/dbname). Paste it as DATABASE_URL.
#   No disk needed — data lives in the hosted Postgres.

services:
  - type: web
    name: zone-media-api
    runtime: python
    plan: free
    autoDeploy: true
    branch: main
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/seed.py && uvicorn app:app --app-dir backend --host 0.0.0.0 --port $PORT"