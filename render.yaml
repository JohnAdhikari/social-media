# Render blueprint — Zone Media backend (FastAPI + SQLite + WebSockets)
# Free tier: WebSockets supported. NOTE: free instances have an EPHEMERAL
# filesystem, so SQLite data resets whenever the instance restarts/spins down.
# (Free plan does NOT allow persistent disks.) For persistent data, upgrade to
# a paid instance and re-add a disk; for a quick demo the ephemeral DB is fine.
#
# Usage (easier than the manual UI):
#   Render dashboard -> New -> Blueprint -> pick this repo.
#   Render detects render.yaml and provisions zone-media-api automatically.

services:
  - type: web
    name: zone-media-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/seed.py && uvicorn app:app --app-dir backend --host 0.0.0.0 --port $PORT"